[project]
name = "catawiki-cli"
version = "0.1.0"
description = "Search Catawiki auctions, track lots, and price them against what comparable lots actually sold for"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jean Galea" }]
dependencies = [
    "curl-cffi>=0.13",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cata = "cata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cata"]

[tool.pytest.ini_options]
markers = ["network: hits catawiki.com, deselected by default"]
addopts = "-m 'not network'"
